</style></head><body><div id="app"><main class="wrap" aria-label="読み込み中"><div class="app-header"><div class="brand"><div class="brand-mark"><span>◈</span></div><div><div class="brand-name">volley lens<span style="color:#837bee">.</span></div><div class="brand-caption">SOFT VOLLEY ANALYTICS</div></div></div></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-buttons"></div></main></div><div id="sheet-root"></div><div id="nav-root"></div><div id="dialog-root"></div><div id="toast-root"></div><div id="fx-root" aria-hidden="true"></div><input type="file" id="backup-import" class="hidden-input" accept="application/json,.json"><script type="module">const SCORE_REASONS = [

const fill=(t,list)=>{for(const x of list){if([...t].length>=50)break;t+=x;}return t;};

function queueCloud({ids=[],all=false}={}){if(all)data.matches.forEach(m=>sync.dirty.add(m.id));else ids.forEach(id=>sync.dirty.add(id));if(sync.mode!=='cloud'&&sync.mode!=='error')return;clearTimeout(sync.timer);sync.timer=setTimeout(flushCloud,700);}
async function flushCloud(){if(!sync.db||(sync.mode!=='cloud'&&sync.mode!=='error'))return;if(sync.flushing){sync.again=true;return;}sync.flushing=true;updatePill();let ids=[];try{do{sync.again=false;ids=[...sync.dirty];sync.dirty.clear();const col=sync.db.collection('data/users/'+sync.uid);for(const id of ids){const m=data.matches.find(x=>x.id===id);if(m){await col.doc('m_'+id).set(JSON.parse(JSON.stringify(m)));sync.remoteIds.add(id);}}const live=new Set(data.matches.map(m=>m.id));for(const id of [...sync.remoteIds]){if(!live.has(id)){await col.doc('m_'+id).delete();sync.remoteIds.delete(id);}}await col.doc('meta').set({version:2,activeMatchId:data.activeMatchId,savedAt:localSavedAt||new Date().toISOString()});ids=[];}while(sync.again||sync.dirty.size);sync.mode='cloud';sync.lastSync=new Date();}catch(e){ids.forEach(id=>sync.dirty.add(id));const code=e?.code;if(code==='invalid_argument'||code==='not_granted'||code==='revoked'||code==='capability_disabled'||code==='capability_removed'){sync.mode='local';sync.reason='readonly';notify('この表示ではクラウドに保存できません。記録はこの端末に保存されます。');}else if(code==='quota_exceeded'){sync.mode='error';notify('クラウドの保存容量がいっぱいです。古い試合を削除してください。');}else{sync.mode='error';setTimeout(()=>{if(sync.mode==='error')flushCloud();},8000);}}finally{sync.flushing=false;updatePill();if(tab==='settings')refreshSyncCard();}}
async function pullCloud(initial){const col=sync.db.collection('data/users/'+sync.uid);const snap=await col.get();sync.lastPull=Date.now();const docs=snap.docs.filter(d=>d.exists);const meta=docs.find(d=>d.id==='meta')?.data();const ms=docs.filter(d=>d.id.startsWith('m_')).map(d=>JSON.parse(JSON.stringify(d.data())));sync.remoteIds=new Set(ms.map(m=>m.id));sync.mode='cloud';const remoteAt=meta?String(meta.savedAt||''):'';if(meta&&ms.length&&(!localSavedAt||remoteAt>localSavedAt)){try{const next=validateAndClean({version:2,activeMatchId:meta.activeMatchId,matches:ms});data=next;localSavedAt=remoteAt;writeLocal();aiText='';render();if(!initial)notify('ほかの端末の記録を読み込みました');sync.lastSync=new Date();}catch(e){queueCloud({all:true});}}else if(!meta||remoteAt<localSavedAt){queueCloud({all:true});}else{sync.lastSync=new Date();}updatePill();if(tab==='settings')refreshSyncCard();}
async function connectCloud(){if(!window.claude){sync.mode='local';sync.reason='standalone';updatePill();return;}sync.mode='connecting';updatePill();const [db,user]=await Promise.all([cap('db'),cap('user')]);let uid=null;try{uid=user?await user.id():null;}catch(_){}if(!db||!uid){sync.mode='local';sync.reason='signedout';updatePill();if(tab==='settings')refreshSyncCard();return;}sync.db=db;sync.uid=uid;try{await pullCloud(true);}catch(e){sync.mode='local';sync.reason='readonly';updatePill();if(tab==='settings')refreshSyncCard();}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sync.mode==='cloud'&&!sync.flushing&&!sync.dirty.size&&!sheet&&Date.now()-sync.lastPull>15000)pullCloud(false).catch(()=>{});});
function pillState(){if(sync.flushing)return['busy','保存中…'];if(sync.mode==='connecting')return['busy','同期の準備中'];if(sync.mode==='cloud')return['','自動で同期'];if(sync.mode==='error')return['warn','同期を再試行中'];return storageOK?['','この端末に保存']:['warn','保存に注意'];}
function updatePill(){const el=document.getElementById('sync-pill');if(!el)return;const [cls,label]=pillState();el.className='status-pill '+cls;el.lastChild.textContent=label;}
function syncText(){if(sync.mode==='connecting')return'同期を準備しています…';if(sync.mode==='cloud'||sync.mode==='error')return`claude.aiのアカウントに自動で保存しています。同じアカウントでほかの端末から開くと、同じ記録の続きができます。記録はあなた専用で、このページを共有した相手にも見えません。${sync.lastSync?`\n最終同期：${sync.lastSync.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`:''}`;if(sync.reason==='standalone')return'この端末のブラウザ内に自動で保存しています。端末を替える前や学期の区切りには、JSONバックアップを保存してください。';return sync.reason==='readonly'?'この共有方法ではクラウドに保存できません（閲覧のみの共有など）。記録はこの端末のブラウザ内に保存されます。JSONバックアップをこまめに保存してください。':'この表示ではクラウド同期を使えません（サインインしていない場合など）。記録はこの端末のブラウザ内に保存されます。JSONバックアップをこまめに保存してください。';}

const STAGGER='.page-intro,.main-col>:not(.stat-grid):not(.action-group),.side-col>:not(.stat-grid),.stat,.action,.match-row';
function render(enter=false){const m=active();if(!m){data=initialData();save({all:true});}const entering=enter||tab!==lastTab;const from=TABS.findIndex(t=>t[0]===lastTab),to=TABS.findIndex(t=>t[0]===tab);const dir=lastTab&&from!==to?(to>from?'from-right':'from-left'):'';lastTab=tab;app.innerHTML=`<main class="wrap ${entering?'enter '+dir:''}">${header()}${tab==='record'?recordView():tab==='chart'?chartView():tab==='matches'?matchesView():settingsView()}<p class="footer-note">volley lens. ・ 児童の名前を入れず、チームで振り返ろう</p></main>`;updateNav();postRender(entering);}
function postRender(entering){const main=app.firstElementChild;if(entering){main.querySelectorAll(STAGGER).forEach((el,i)=>el.style.setProperty('--i',Math.min(i,12)));countUp(main);}const m=active(),sc=getScore(m);if(shownScore&&shownScore.id===m.id&&!entering){const dm=sc.mine-shownScore.mine,dt=sc.theirs-shownScore.theirs;if(dm)scoreFx('mine',dm);if(dt)scoreFx('theirs',dt);}shownScore={id:m.id,mine:sc.mine,theirs:sc.theirs};freshId=null;}
function countUp(root){if(reduceMotion())return;root.querySelectorAll('[data-count]').forEach(el=>{const to=Number(el.dataset.count);if(!Number.isFinite(to)||to<=0)return;const t0=performance.now(),d=650+Math.min(to,40)*14;el.textContent='0';const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=String(Math.round(to*e));if(p<1)requestAnimationFrame(step);else el.textContent=String(to);};requestAnimationFrame(step);});}
function restart(el,cls){el.classList.remove(...cls.split(' '));void el.offsetWidth;}
function scoreFx(side,delta){const el=document.getElementById(side==='mine'?'score-mine':'score-theirs');if(!el)return;restart(el,'bump shake dip');el.classList.add(delta>0?(side==='mine'?'bump':'shake'):'dip');if(delta>0&&!reduceMotion()){const f=document.createElement('span');f.className='float-delta'+(side==='mine'?'':' bad');f.textContent='+'+delta;el.parentElement.appendChild(f);setTimeout(()=>f.remove(),1150);const card=el.closest('.score-card');if(card){restart(card,'flash-good flash-bad');card.classList.add(side==='mine'?'flash-good':'flash-bad');}}}
function burst(x,y,{count=22,power=1,colors=['#7775f1','#9a8bff','#59c9b1','#ffc65c','#f18d99']}={}){if(reduceMotion())return;for(let i=0;i<count;i++){const el=document.createElement('i');el.className='confetti'+(i%3===0?' dot':'');el.style.background=colors[i%colors.length];el.style.left=x+'px';el.style.top=y+'px';fxRoot.appendChild(el);const ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.5,v=(70+Math.random()*110)*power,dx=Math.cos(ang)*v,dy=Math.sin(ang)*v,rot=(Math.random()-.5)*720;const anim=el.animate([{transform:'translate(-50%,-50%) scale(.4) rotate(0deg)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${rot*.6}deg)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx*1.25}px),calc(-50% + ${dy+150*power}px)) scale(.7) rotate(${rot}deg)`,opacity:0}],{duration:1000+Math.random()*500,easing:'cubic-bezier(.15,.65,.35,1)'});anim.onfinish=()=>el.remove();}}
function burstAt(el,opts){const r=el?.getBoundingClientRect();const inView=r&&r.bottom>0&&r.top<innerHeight;burst(inView?r.left+r.width/2:innerWidth/2,inView?r.top+r.height/2:innerHeight*.35,opts);}
function bonusPop(){if(reduceMotion())return;const el=document.createElement('div');el.className='bonus-pop';el.innerHTML='<b>全員ボーナス</b><span>＋2点！</span>';fxRoot.appendChild(el);setTimeout(()=>el.remove(),1650);burst(innerWidth/2,innerHeight*.36,{count:34,power:1.5,colors:['#63d3b3','#ffc65c','#ffffff','#9a8bff','#38a88e']});}
function buzz(ms){try{navigator.vibrate?.(ms);}catch(_){}}

function notify(message,actionText='',fn=null){clearTimeout(toastTimer);toastRoot.innerHTML=`<div class="toast" role="status"><span>${esc(message)}</span>${actionText?`<button id="toast-action">${esc(actionText)}</button><i class="toast-bar"></i>`:''}</div>`;if(fn)document.getElementById('toast-action').addEventListener('click',()=>{clearTimeout(toastTimer);toastRoot.innerHTML='';fn();});toastTimer=setTimeout(()=>{const t=toastRoot.firstElementChild;if(!t)return;t.classList.add('out');toastTimer=setTimeout(()=>{toastRoot.innerHTML='';},260);},5500);}

// ---- ページ内の確認ダイアログ（confirm / prompt の代わり） ----
let dialogResolve=null;
function ask({title,message='',ok='OK',cancel='キャンセル',danger=false,input=null}){return new Promise(resolve=>{clearTimeout(dialogTimer);if(dialogResolve)dialogResolve(null);dialogResolve=resolve;dialogRoot.innerHTML=`<div class="modal-backdrop" id="dialog-backdrop"><section class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title"><div class="handle"></div><h2 class="sheet-title" id="dialog-title">${esc(title)}</h2>${message?`<p class="dialog-msg">${esc(message)}</p>`:''}${input?`<div class="field" style="margin-top:14px"><label for="dialog-input">${esc(input.label)}</label><input id="dialog-input" maxlength="${input.max||60}" value="${esc(input.value||'')}" autocomplete="off"></div>`:''}<div class="dialog-actions"><button type="button" class="btn ghost" data-dialog="cancel">${esc(cancel)}</button><button type="button" class="btn ${danger?'danger-solid':''}" data-dialog="ok">${esc(ok)}</button></div></section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>{const el=document.getElementById('dialog-input');if(el){el.focus();el.select();}else dialogRoot.querySelector('[data-dialog="ok"]')?.focus();});});}
function closeDialog(result){const r=dialogResolve;dialogResolve=null;const bd=document.getElementById('dialog-backdrop');const clear=()=>{if(dialogResolve)return;dialogRoot.innerHTML='';if(!sheet)document.body.style.overflow='';};if(bd&&!reduceMotion()){bd.classList.add('closing');clearTimeout(dialogTimer);dialogTimer=setTimeout(clear,230);}else clear();r?.(result);}
dialogRoot.addEventListener('click',e=>{const b=e.target.closest('[data-dialog]');if(b){if(b.dataset.dialog==='ok'){const inp=document.getElementById('dialog-input');closeDialog(inp?inp.value:true);}else closeDialog(null);}else if(e.target.id==='dialog-backdrop')closeDialog(null);});
dialogRoot.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dialog-input'){e.preventDefault();closeDialog(e.target.value);}});

function openSheet(type){const m=active();if(m.endedAt){notify('終了した試合です。先に再開してください。');return;}clearTimeout(sheetTimer);sheet={type,chain:null,bonus:false};drawSheet();}
function closeSheet(){if(!sheet)return;sheet=null;const bd=document.getElementById('modal-backdrop');if(!bd||reduceMotion()){drawSheet();return;}bd.classList.add('closing');clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>{if(!sheet)drawSheet();},240);}
function drawSheet(){if(!sheet){sheetRoot.innerHTML='';document.body.style.overflow='';return;}const isScore=sheet.type==='score';const reasons=isScore?SCORE_REASONS:FAULT_REASONS;sheetRoot.innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><div class="sheet-top"><div><h2 class="sheet-title" id="sheet-title">${isScore?'得点をきろく':'失点をきろく'}</h2><p class="sheet-caption">${isScore?'どんなプレーで得点できた？':'どんなプレーで失点した？'}</p></div><button class="sheet-close" data-action="close-sheet" aria-label="閉じる">×</button></div><div class="sheet-label" style="margin-top:4px">理由をタップすると記録されます</div><div class="reason-list">${reasons.map((r,i)=>`<button class="reason-btn ${isScore?'':'fault'}" style="--i:${i}" data-action="reason" data-id="${esc(r.id)}"><span>${esc(r.icon)}</span><div>${esc(r.label)}</div></button>`).join('')}</div>${isScore&&active().bonusRule?`<label class="bonus-check"><input type="checkbox" id="bonus-check" ${sheet.bonus?'checked':''}>全員でつないだ得点 ＋1点</label>`:''}<button class="sheet-cancel" data-action="close-sheet">キャンセル</button></section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>sheetRoot.querySelector('.sheet-close')?.focus());}
function recordReason(reason){const m=active();if(!sheet||!reasonFor(sheet.type,reason))return;const e={id:uid(),type:sheet.type,reason,chain:sheet.chain,bonus:sheet.type==='score'&&m.bonusRule&&sheet.bonus,at:new Date().toISOString()};m.events.push(e);changed(m);freshId=e.id;render();closeSheet();if(e.type==='score'){buzz(e.bonus?[20,40,30]:18);burstAt(document.getElementById('score-mine'),{count:e.bonus?30:20});if(e.bonus)setTimeout(bonusPop,160);}else buzz(35);notify(e.type==='score'?'得点を記録しました':'失点を記録しました','取り消す',()=>removeEvent(e.id));}
function removeEvent(id){const wrap=document.querySelector(`[data-wrap-id="${CSS.escape(id)}"]`);if(wrap&&!reduceMotion()&&!wrap.dataset.leaving){wrap.dataset.leaving='1';wrap.style.pointerEvents='none';const a=wrap.animate([{height:wrap.offsetHeight+'px',opacity:1,marginTop:'0px'},{height:'0px',opacity:0,marginTop:'-8px'}],{duration:260,easing:'cubic-bezier(.4,0,.2,1)'});a.onfinish=()=>doRemoveEvent(id);return;}doRemoveEvent(id);}
function doRemoveEvent(id){const m=active(),index=m.events.findIndex(e=>e.id===id);if(index<0)return;const [removed]=m.events.splice(index,1);undoEvent={matchId:m.id,index,event:removed};changed(m);render();notify('記録を取り消しました','元に戻す',restoreEvent);}
function restoreEvent(){if(!undoEvent)return;const m=data.matches.find(x=>x.id===undoEvent.matchId);if(!m)return;if(!m.events.some(e=>e.id===undoEvent.event.id)){m.events.splice(undoEvent.index,0,undoEvent.event);changed(m);}undoEvent=null;render();notify('記録を戻しました');}
function setTab(t){if(!['record','chart','matches','settings'].includes(t))return;tab=t;render(true);window.scrollTo({top:0,behavior:'auto'});}
async function createMatch(){const num=data.matches.length+1,prev=active();const name=await ask({title:'新しい試合',message:'チーム名と授業ルールは今の試合から引き継ぎます。',ok:'作成',input:{label:'試合の名前',value:`ゲーム ${num}`,max:60}});if(name===null)return;const m=newMatch({name:safeText(name,60)||`ゲーム ${num}`,team:prev.team,opponent:prev.opponent,goal:prev.goal,bonusRule:prev.bonusRule});data.matches.push(m);data.activeMatchId=m.id;save({ids:[m.id]});aiText='';setTab('record');notify('新しい試合を作りました');}
function loadSample(){const demo=makeDemo().matches[0];demo.name='サンプル：5年3組・練習ゲーム';const cur=active();if(data.matches.length===1&&!cur.events.length){data.matches=[demo];}else{data.matches.push(demo);}data.activeMatchId=demo.id;save({all:true});aiText='';render();notify('サンプルを読み込みました。不要なら「試合」から削除できます');}
async function offerFile(filename,text,mime){const dl=await cap('downloads');if(!dl){if(!window.claude){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return;}notify('この表示ではファイルを保存できません');return;}try{await dl.save({filename,data:text});notify('ファイルを保存しました');}catch(e){if(e?.code==='declined')return;if(e?.code==='rate_limited'){notify('保存の確認がすでに開いています');return;}notify('ファイルを保存できませんでした');}}
function csvText(){const rows=[['match_id','match_name','team','opponent','date','event_type','reason','chain','everyone_bonus','own_score','opponent_score']];for(const m of data.matches){let own=0,opp=0;for(const e of m.events){if(e.type==='score')own+=1+(e.bonus?1:0);else opp++;rows.push([m.id,m.name,m.team,m.opponent,e.at,e.type,reasonFor(e.type,e.reason)?.label||'',e.chain===null?'':e.chain,e.bonus?'yes':'no',own,opp]);}}const cell=v=>{const value=String(v??'').replace(/^[=+@\-\t\r]/,m=>"'"+m);return '"'+value.replace(/"/g,'""')+'"';};return '﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');}
async function importJSON(file){if(!file)return;if(file.size>8*1024*1024){notify('ファイルが大きすぎます（上限8MB）');return;}try{const next=validateAndClean(JSON.parse(await file.text()));if(!await ask({title:'バックアップを読み込む',message:`試合${next.matches.length}件を読み込みます。現在の記録は上書きされます。`,ok:'読み込む',danger:true}))return;data=next;save({all:true});setTab('matches');notify('バックアップを復元しました');}catch(e){notify('読み込み失敗：'+e.message);}finally{importInput.value='';}}
function updateAIText(){const el=document.getElementById('ai-result');if(el)el.textContent=aiText||'考えています…';}
async function runAI(){const m=active(),s=getStats(m);if(!s.rallies||workingAI)return;const fallback=analyze(m).strength+'\n'+analyze(m).challenge;workingAI=true;aiText='';render();const sample=await cap('sample');if(!sample){workingAI=false;aiText='この表示ではAIを利用できません。記録からのヒント：\n\n'+fallback;render();return;}const f=analyze(m).facts;const aggregated={ラリー数:s.rallies,得点ラリー:s.won,失点ラリー:s.lost,全員ボーナス:s.bonus,最大連続得点:f.maxW,最大連続失点:f.maxL,前半の得点率:f.firstHalfRate,後半の得点率:f.secondHalfRate,自分たちの力での得点:f.ownPoints,相手のミスによる得点:f.opponentMistakePoints,自分たちのミスによる失点:f.ownFaults,守りきれなかった失点:f.defenseFaults,得点の理由:Object.fromEntries(s.scoreReasons.map(r=>[r.label,r.count])),失点の理由:Object.fromEntries(s.faultReasons.map(r=>[r.label,r.count]))};const prompt=`あなたは小学校体育のソフトバレーボールの授業を支える指導アドバイザーです。以下は1試合分のチームの集計です（児童個人の情報は含みません）。\n授業ルール：3〜4人制、2バウンド可、キャッチして仲間に渡すのも可（これらはミスに数えない）。全員でつないで得点したら＋1点。\n\n集計：${JSON.stringify(aggregated)}\n\n小学校6年生が読んで分かるように、6年生までに習う漢字を使い、です・ます調の丁寧な言葉と短い文で（難しい言葉や％は使わない）、全体300字以内で次の4つを書いてください。見出しは【】で囲み、マークダウン記号（**や#）は使わないでください。\n【よかったところ】最も大事なよい点を、50〜70字\n【次にがんばること】最も多い失点と次にどうするかを、50〜70字\n【おすすめの練習】練習名と、10分ほどでできるやり方を1つ\n【子どもへの問いかけ】1つ\n記録が少ないときは、傾向が仮のものだと一言添えてください。原因を決めつけないでください。`;try{const res=await sample(prompt,{modelTier:'default',onText:({text})=>{aiText=text;updateAIText();}});aiText=String(res.text||'回答がありません').slice(0,3000);}catch(e){if(e?.code==='not_granted')aiText='AIの利用が許可されませんでした。記録からのヒント：\n\n'+fallback;else if(e?.code==='rate_limited')aiText='少し時間をおいてから、もう一度お試しください。';else aiText=(e?.text?String(e.text)+'\n\n':'')+'AIに接続できませんでした。記録からのヒント：\n\n'+fallback;}finally{workingAI=false;render();}}

// イベント委譲で、画面を再描画してもタップは失われません。
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id,m=active();switch(action){case'tab':setTab(id);break;case'sheet':openSheet(el.dataset.type);break;case'close-sheet':closeSheet();break;case'reason':recordReason(id);break;case'undo-last':if(m.events.length)removeEvent(m.events[m.events.length-1].id);break;case'remove-event':removeEvent(id);break;case'end-match':if(await ask({title:'試合を終える',message:'この試合の記録を終了します。後から再開できます。',ok:'終了する'})){m.endedAt=new Date().toISOString();changed(m);render();const fin=getScore(m);if(fin.mine>fin.theirs){burst(innerWidth*.2,innerHeight*.45,{count:30,power:1.4});burst(innerWidth*.8,innerHeight*.45,{count:30,power:1.4});notify('試合終了！よくがんばりました');}else notify('試合を終了しました');}break;case'resume':m.endedAt=null;changed(m);render();break;case'new-match':createMatch();break;case'load-sample':loadSample();break;case'open-match':data.activeMatchId=id;save();aiText='';setTab('record');break;case'delete-match':{const target=data.matches.find(x=>x.id===id);if(!target)return;if(!await ask({title:'試合を削除',message:`「${target.name}」を削除します。この操作は元に戻せません。`,ok:'削除する',danger:true}))return;data.matches=data.matches.filter(x=>x.id!==id);let fresh=[];if(!data.matches.length){const n=newMatch();data.matches=[n];fresh=[n.id];}if(data.activeMatchId===id)data.activeMatchId=data.matches[0].id;save({ids:fresh});render();break;}case'export-json':offerFile('volley-lens-backup.json',JSON.stringify(data,null,2),'application/json');break;case'export-csv':offerFile('volley-lens-records.csv',csvText(),'text/csv;charset=utf-8');break;case'import':importInput.click();break;case'reset-all':if(await ask({title:'すべての記録を消す',message:'すべての試合記録を削除します。同期しているほかの端末からも消えます。この操作は戻せません。',ok:'すべて消す',danger:true})){data=initialData();save({all:true});setTab('record');}break;case'sync-now':if(sync.db){try{await flushCloud();await pullCloud(false);notify('同期しました');}catch(e){notify('同期できませんでした。少し時間をおいてお試しください。');}}break;case'ai':runAI();break;}});
sheetRoot.addEventListener('change',e=>{if(e.target?.id==='bonus-check'&&sheet)sheet.bonus=e.target.checked;});
document.addEventListener('submit',e=>{if(e.target.id==='goal-form'){e.preventDefault();const m=active();m.goal=safeText(new FormData(e.target).get('goal'),140);changed(m);render();notify('次の作戦を保存しました');return;}if(e.target.id!=='match-form')return;e.preventDefault();const fd=new FormData(e.target),m=active();m.name=safeText(fd.get('name'),60)||'ゲーム';m.team=safeText(fd.get('team'))||'じぶんチーム';m.opponent=safeText(fd.get('opponent'))||'あいてチーム';m.bonusRule=fd.has('bonusRule');changed(m);render();notify('設定を保存しました');});
importInput.addEventListener('change',e=>importJSON(e.target.files?.[0]));
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(dialogResolve){closeDialog(null);return;}if(sheet)closeSheet();});
sheetRoot.addEventListener('click',e=>{if(e.target?.id==='modal-backdrop')closeSheet();});
let drag=null;
document.addEventListener('touchstart',e=>{const row=e.target.closest('.entry[data-swipe-id]');if(row&&e.touches.length===1&&!e.target.closest('button'))drag={row,id:row.dataset.swipeId,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,axis:null};},{passive:true});
document.addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;if(!drag.axis&&(Math.abs(dx)>8||Math.abs(dy)>8))drag.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';if(drag.axis!=='x')return;drag.dx=Math.min(0,dx);drag.row.style.transition='none';drag.row.style.transform=`translateX(${drag.dx}px)`;drag.row.parentElement.classList.toggle('armed',drag.dx<-90);},{passive:true});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;d.row.style.transition='';if(d.axis==='x'&&d.dx<-90){d.row.style.transform='translateX(-110%)';buzz(20);setTimeout(()=>removeEvent(d.id),170);}else{d.row.style.transform='';d.row.parentElement.classList.remove('armed');}};
document.addEventListener('touchend',endDrag,{passive:true});document.addEventListener('touchcancel',endDrag,{passive:true});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.btn,.action,.reason-btn,.nav-item,.text-btn');if(!el||el.disabled||reduceMotion())return;const r=el.getBoundingClientRect(),size=Math.max(r.width,r.height)*2.2;const sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;el.appendChild(sp);setTimeout(()=>sp.remove(),650);});
render();connectCloud();
</script>
